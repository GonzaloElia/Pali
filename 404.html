<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Página no encontrada · Pali</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"IBM Plex Sans",system-ui,sans-serif;background:#0F3D2E;color:#fff;text-align:center;padding:24px}a{color:#A9D6C4}</style></head>
<body><div><h1 style="margin:0 0 8px;font-size:28px">No encontramos esa página</h1><p style="color:#D3E7DD">Puede que el link haya cambiado. <a id="home" href="./">Volver al inicio de Pali</a></p></div>
<script>/* En GitHub Pages el sitio vive en /Pali/: el link vuelve a la raíz del proyecto */
(function(){var p=location.pathname.split('/').filter(Boolean);if(location.hostname.indexOf('github.io')>-1&&p.length)document.getElementById('home').href='/'+p[0]+'/';})();</script>
</body></html>
