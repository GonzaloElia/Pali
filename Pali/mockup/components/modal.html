<!-- Modal. Se muestra quitando el atributo hidden de #scrim. Cierra con clic afuera, la X o Esc (ver agenda.html). -->
<div id="scrim" class="scrim" hidden data-act="scrim">
  <div id="modal" class="modal">
    <div class="modal-head">
      <div><h3>Reservar turno</h3><p class="sub">Cancha 1 · 18:00–19:30</p></div>
      <button class="modal-close" data-act="close" aria-label="Cerrar">×</button>
    </div>
    <!-- contenido -->
    <div class="modal-foot">
      <button class="btn btn--primary" data-act="reserve">Reservar</button>
    </div>
  </div>
</div>
