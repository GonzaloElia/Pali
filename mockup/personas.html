<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personas · Pali backoffice</title>
<link rel="stylesheet" href="css/main.css">
<script>/* Tema y barra lateral: se aplican antes de pintar para evitar parpadeos */
(function(){try{var d=document.documentElement,t=localStorage.getItem('pali-theme');
if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';
if(t==='dark')d.setAttribute('data-theme','dark');
if(localStorage.getItem('pali-sidebar')==='hidden')d.setAttribute('data-sidebar','hidden');}catch(e){}})();</script>
<script src="js/mock-api.js"></script>
</head>
<body>
<div class="app">

  <aside class="sidebar" data-nav="personas">
    <p class="brand">Pali <em>· backoffice</em></p>
    <p class="brand-sub">Club de ejemplo</p>
    <script src="js/nav.js"></script>
    <div class="foot"><a href="index.html">Mapa de flujos</a></div>
  </aside>

  <main class="main">
    <header class="page-header">
      <p class="kicker">Backoffice · Personas</p>
      <h2>Buscar o crear, <em>desde un solo lugar</em>.</h2>
      <p class="lede">Con nombre y apellido se busca. Si no existe, se crea en el momento y se le piden sus datos. Cada persona guarda en qué canchas jugó.</p>
    </header>

    <div class="grid-2" style="align-items:start">
      <div>
        <div class="field">
          <label class="label" for="q">Buscador único</label>
          <div class="combo">
            <input id="q" class="input" type="text" placeholder="Nombre y apellido" autocomplete="off">
            <div id="comboList" class="combo-list" hidden></div>
          </div>
        </div>

        <div id="newPerson" class="card mt-4" hidden></div>

        <p class="kicker mt-6">Todas las personas</p>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Nombre</th><th>Categoría</th><th>Teléfono</th></tr></thead>
            <tbody id="all"></tbody>
          </table>
        </div>
      </div>

      <div id="detail"></div>
    </div>

    <div id="toast" class="toast" hidden></div>
  </main>
</div>

<script>
/* Pantalla Personas. Lógica en el HTML; datos siempre vía PaliApi. */
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var pname = PaliApi.util.personLabel;   // “Juan Pérez” o “Juan Pérez (alias)”
  var S = { cats: [], q: '', results: [], all: [], person: null, history: [], newPerson: null };

  function say(msg) { var t = $('#toast'); t.textContent = msg; t.hidden = false; setTimeout(function () { t.hidden = true; }, 2200); }
  function day(b) {
    var s = PaliApi.util.parseDate(b.date).toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  async function init() { S.cats = await PaliApi.listCategories(); S.all = await PaliApi.listPeople(); renderAll(); renderDetail(); }

  function renderAll() {
    $('#all').innerHTML = S.all.map(function (p) {
      return '<tr style="cursor:pointer" data-act="select" data-id="' + p.id + '"><td>' + esc(pname(p)) + '</td><td>' + esc(p.category || '—') + '</td><td class="mono">' + esc(p.phone) + '</td></tr>';
    }).join('');
  }

  /* buscador único */
  function canCreate() {
    var n = S.q.trim().toLowerCase();
    return !!n;   // siempre se puede crear: puede haber dos personas con el mismo nombre (se distinguen por el alias)
  }
  function renderCombo() {
    var el = $('#comboList');
    var html = S.results.map(function (p) {
      return '<button type="button" class="combo-item" data-act="select" data-id="' + p.id + '"><span class="row" style="gap:10px">' + esc(pname(p)) + (p.category ? '<span class="chip chip--soft">' + esc(p.category) + '</span>' : '') + '</span><small>' + esc(p.phone) + '</small></button>';
    }).join('');
    if (canCreate()) html += '<button type="button" class="combo-item combo-item--create" data-act="startCreate"><span>' + (S.results.length ? 'Crear otra persona' : 'Crear persona') + ' “' + esc(S.q.trim()) + '”</span><small>' + (S.results.length ? 'con alias' : '+ nueva') + '</small></button>';
    el.innerHTML = html;
    el.hidden = !S.q.trim().length;
  }
  async function onType() { S.q = $('#q').value; S.results = await PaliApi.searchPeople(S.q); renderCombo(); }

  function renderNew() {
    var el = $('#newPerson'), np = S.newPerson;
    if (!np) { el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    el.innerHTML = '<p class="kicker">Nueva persona</p><div class="stack--form">' +
      '<div class="grid-2" style="gap:12px"><div class="field"><label class="label">Nombre</label><input id="npFirst" class="input" value="' + esc(np.firstName) + '"></div>' +
      '<div class="field"><label class="label">Apellido</label><input id="npLast" class="input" value="' + esc(np.lastName) + '"></div></div>' +
      '<div class="field"><label class="label" for="npPhone">Teléfono</label><input id="npPhone" class="input" placeholder="Ej: 2284-363702"></div>' +
      '<div class="grid-2" style="gap:12px"><div class="field"><label class="label" for="npAlias">Alias <span class="hint">(opcional)</span></label><input id="npAlias" class="input" placeholder="Ej: Tincho" autocomplete="off" title="Para distinguir a dos personas con el mismo nombre y apellido"></div>' +
      '<div class="field"><label class="label" for="npCat">Categoría</label><select id="npCat" class="select"><option value="" disabled selected>Elegí una categoría</option>' +
      S.cats.map(function (c) { return '<option value="' + c.id + '">' + esc(c.name) + '</option>'; }).join('') + '</select></div></div>' +
      '<p id="npErr" class="field-error" hidden></p>' +
      '<div class="row"><button class="btn btn--primary" data-act="saveNew">Crear persona</button><button class="btn btn--ghost" data-act="cancelNew">Cancelar</button></div></div>';
  }

  /* Campos obligatorios: si falta alguno se marca y se avisa por campo y con un resumen */
  function validatePerson() {
    var req = [['npFirst', 'Nombre'], ['npLast', 'Apellido'], ['npPhone', 'Teléfono'], ['npCat', 'Categoría']], missing = [], first = null;
    req.forEach(function (r) {
      var el = $('#' + r[0]), empty = !el.value.trim(), f = el.closest('.field'), m = f.querySelector('.field-error');
      f.classList.toggle('field--error', empty);
      if (empty) {
        if (!m) { m = document.createElement('p'); m.className = 'field-error'; f.appendChild(m); }
        m.textContent = 'Falta completar el campo ' + r[1] + ': es obligatorio.';
        missing.push(r[1]); if (!first) first = el;
      } else if (m) m.remove();
    });
    var err = $('#npErr');
    err.hidden = !missing.length;
    if (missing.length) {
      err.textContent = 'No se puede continuar: ' + (missing.length > 1 ? 'faltan los campos obligatorios ' : 'falta el campo obligatorio ') + missing.join(', ') + '.';
      first.focus();
    }
    return !missing.length;
  }
  function renderDetail() {
    var el = $('#detail'), p = S.person;
    if (!p) { el.innerHTML = '<div class="card"><p class="muted">Elegí una persona para ver en qué canchas jugó.</p></div>'; return; }
    var m = {};
    S.history.forEach(function (b) { m[b.courtName] = (m[b.courtName] || 0) + 1; });
    var chips = Object.keys(m).map(function (k) { return '<span class="chip chip--soft">' + esc(k) + ' · ' + m[k] + (m[k] === 1 ? ' vez' : ' veces') + '</span>'; }).join('');
    el.innerHTML =
      '<div class="card"><p class="kicker">Persona</p><h3>' + esc(pname(p)) + '</h3>' +
      '<p class="muted small mt-2">Tel. ' + esc(p.phone || 'sin cargar') + ' · Categoría ' + esc(p.category || 'sin cargar') + '</p></div>' +
      '<p class="kicker mt-5">Canchas donde jugó</p>' +
      '<div class="row wrap">' + (chips || '<span class="muted small">Todavía no jugó.</span>') + '</div>' +
      (S.history.length
        ? '<div class="table-wrap mt-4"><table class="table"><thead><tr><th>Día</th><th>Hora</th><th>Cancha</th></tr></thead><tbody>' +
          S.history.slice(0, 12).map(function (b) {
            return '<tr><td>' + esc(day(b)) + '</td><td class="mono">' + b.start + '–' + b.end + '</td><td>' + esc(b.courtName) + '</td></tr>';
          }).join('') + '</tbody></table></div>'
        : '');
  }

  async function select(id) {
    var p = S.all.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    S.person = p; S.history = await PaliApi.getPersonHistory(p.id);
    S.q = ''; S.results = []; $('#q').value = ''; renderCombo(); renderDetail();
  }

  var actions = {
    select: function (d) { select(d.id); },
    startCreate: function () {
      var parts = S.q.trim().split(/\s+/);
      S.newPerson = { firstName: parts[0] || '', lastName: parts.slice(1).join(' ') };
      $('#comboList').hidden = true; renderNew();
    },
    cancelNew: function () { S.newPerson = null; renderNew(); },
    saveNew: async function () {
      var f = $('#npFirst').value.trim(), l = $('#npLast').value.trim();
      if (!validatePerson()) return;
      var p = await PaliApi.createPerson({ firstName: f, lastName: l, alias: $('#npAlias').value.trim(), phone: $('#npPhone').value.trim(), categoryId: $('#npCat').value });
      S.newPerson = null; renderNew();
      S.all = await PaliApi.listPeople(); renderAll();
      await select(p.id); say('Persona creada');
    }
  };
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.combo') && $('#comboList')) $('#comboList').hidden = true;
    var el = e.target.closest('[data-act]');
    if (el && actions[el.dataset.act]) actions[el.dataset.act](el.dataset);
  });
  $('#q').addEventListener('input', onType);
  $('#q').addEventListener('focus', function () { if ($('#q').value) onType(); });

  init();
})();
</script>
<script>
/* Controles del shell (iguales en todas las pantallas): tema claro/oscuro con onda y ocultar la barra lateral. */
(function () {
  var root = document.documentElement;
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var SUN = '<svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
  var CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
  var MENU = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';

  function isDark() { return root.getAttribute('data-theme') === 'dark'; }
  function paintTheme() {
    var b = document.getElementById('themeToggle');
    b.setAttribute('aria-label', isDark() ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro');
    b.title = isDark() ? 'Tema claro' : 'Tema oscuro';
  }
  function setTheme(dark) {
    if (dark) root.setAttribute('data-theme', 'dark'); else root.removeAttribute('data-theme');
    save('pali-theme', dark ? 'dark' : 'light'); paintTheme();
  }
  function toggleTheme(ev) {
    var next = !isDark(), btn = ev.currentTarget, r = btn.getBoundingClientRect();
    var x = ev.clientX || r.left + r.width / 2, y = ev.clientY || r.top + r.height / 2;
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || !document.startViewTransition) { setTheme(next); return; }
    var ring = document.createElement('div'); ring.className = 'theme-ripple';
    ring.style.left = x + 'px'; ring.style.top = y + 'px'; document.body.appendChild(ring);
    setTimeout(function () { ring.remove(); }, 700);
    var end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    var t = document.startViewTransition(function () { setTheme(next); });
    t.ready.then(function () {
      root.animate(
        { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + end + 'px at ' + x + 'px ' + y + 'px)'] },
        { duration: 650, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', pseudoElement: '::view-transition-new(root)' }
      );
    });
  }

  function setSidebar(hidden) {
    if (hidden) root.setAttribute('data-sidebar', 'hidden'); else root.removeAttribute('data-sidebar');
    save('pali-sidebar', hidden ? 'hidden' : 'shown');
    var o = document.getElementById('navOpen'); if (o) o.setAttribute('aria-expanded', String(!hidden));
  }

  var theme = document.createElement('button');
  theme.id = 'themeToggle'; theme.className = 'shell-btn theme-toggle'; theme.innerHTML = MOON + SUN;
  theme.addEventListener('click', toggleTheme); document.body.appendChild(theme); paintTheme();

  var side = document.querySelector('.sidebar');
  if (side) {
    /* Ocultar menú: ícono chico arriba a la derecha de la barra lateral */
    var hide = document.createElement('button');
    hide.className = 'nav-hide'; hide.innerHTML = CHEV;
    hide.setAttribute('aria-label', 'Ocultar menú'); hide.title = 'Ocultar menú';
    hide.addEventListener('click', function () { setSidebar(true); });
    side.appendChild(hide);

    /* Menú de usuario al pie: rol de quien ingresó y, por ahora, solo "Cerrar sesión" (simulado) */
    var who = 'admin@tuclub.com';
    try { who = sessionStorage.getItem('pali-session') || who; } catch (e) {}
    var UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>';
    var OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>';
    var menu = document.createElement('div'); menu.className = 'user-menu';
    menu.innerHTML =
      '<div class="user-pop" role="menu" hidden><button type="button" class="user-item" role="menuitem" data-logout>' + OUT + '<span>Cerrar sesión</span></button></div>' +
      '<button type="button" class="user-btn" aria-haspopup="menu" aria-expanded="false">' +
        '<span class="avatar" aria-hidden="true">A</span>' +
        '<span class="user-info"><b>Administrador</b><small></small></span>' + UP + '</button>';
    menu.querySelector('small').textContent = who;
    var pop = menu.querySelector('.user-pop'), ubtn = menu.querySelector('.user-btn');
    function togglePop(show) { pop.hidden = !show; ubtn.setAttribute('aria-expanded', String(show)); menu.classList.toggle('is-open', show); }
    ubtn.addEventListener('click', function (e) { e.stopPropagation(); togglePop(pop.hidden); });
    menu.querySelector('[data-logout]').addEventListener('click', function () {
      try { sessionStorage.removeItem('pali-session'); } catch (e) {}
      location.href = 'login.html';
    });
    document.addEventListener('click', function (e) { if (!menu.contains(e.target)) togglePop(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') togglePop(false); });
    side.appendChild(menu);
    var open = document.createElement('button');
    open.id = 'navOpen'; open.className = 'shell-btn nav-open'; open.innerHTML = MENU;
    open.setAttribute('aria-label', 'Mostrar menú'); open.title = 'Mostrar menú';
    open.setAttribute('aria-expanded', String(root.getAttribute('data-sidebar') !== 'hidden'));
    open.addEventListener('click', function () { setSidebar(false); });
    document.body.appendChild(open);
  }
})();
</script>
</body>
</html>
