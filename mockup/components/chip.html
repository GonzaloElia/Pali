     Secundarios: chip--sky (datos), chip--lav (categoría), chip--lav-solid (Promo). chip--dashed: dato “a confirmar”.
     Nunca “x de 4”: solo la cantidad de personas. -->
<span class="chip chip--soft" style="border-style:dashed">Reservado</span>
<span class="chip chip--ink">Completo</span>
<span class="chip chip--sky-solid">✓ Finalizado</span>
<span class="chip chip--sky">Cancha 1 · 4 veces</span>
<span class="chip chip--lav">8ª</span>
<span class="chip chip--lav-solid">Promo</span>
<span class="chip chip--dashed">a confirmar</span>
