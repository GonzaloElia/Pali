<!-- Botones: primario (verde de marca, acción principal), oscuro (Aceptar), neutro, peligro (borde coral, solo cancelar), fantasma.
     Tamaños: --sm, --lg. Botón de ícono: icon-btn. Check de completar: check-btn (se prende y apaga, como el ojito). -->
<button class="btn btn--primary">Reservar</button>
<button class="btn btn--dark">Aceptar</button>
<button class="btn btn--neutral">Cancelar</button>
<button class="btn btn--danger">Cancelar turno</button>
<button class="btn btn--ghost btn--sm">Quitar</button>
<button type="button" class="icon-btn" aria-label="Elegir columnas" title="Elegir columnas"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg></button>
<button type="button" class="check-btn" aria-pressed="false" aria-label="Marcar como completado" title="Marcar como completado"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12.5l4.2 4.2L18.5 7.5"/></svg></button>
